<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; margin: 0; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .header { background-color: #10b981; padding: 24px; text-align: center; color: #ffffff; font-size: 24px; font-weight: bold; }
        .content { padding: 32px; color: #374151; line-height: 1.6; text-align: center; }
        .amount { font-size: 36px; font-weight: bold; color: #111827; margin: 16px 0; }
        .button { display: inline-block; background-color: #111827; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 24px; }
        .footer { padding: 24px; text-align: center; font-size: 12px; color: #6b7280; background-color: #f3f4f6; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">PaymentX</div>
    <div class="content">
        <p>Hi <strong>{{USER_NAME}}</strong>,</p>
        <p>Your wallet top-up was successful! The funds are now available in your account.</p>

        <div class="amount">₹{{AMOUNT}}</div>

        <p>You can now use your wallet for seamless tap-and-pay transactions across the campus.</p>
        <a href="{{DASHBOARD_URL}}" class="button">View Wallet Balance</a>
    </div>
    <div class="footer">
        &copy; 2026 PaymentX Technologies. All rights reserved.
    </div>
</div>
</body>
</html>
