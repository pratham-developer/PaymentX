<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; margin: 0; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .header { background-color: #3b82f6; padding: 24px; text-align: center; color: #ffffff; font-size: 24px; font-weight: bold; }
        .content { padding: 32px; color: #374151; line-height: 1.6; }
        .receipt-box { background-color: #f3f4f6; border-left: 4px solid #374151; padding: 16px; margin: 24px 0; border-radius: 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .button { display: inline-block; background-color: #111827; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 16px; }
        .footer { padding: 24px; text-align: center; font-size: 12px; color: #6b7280; background-color: #f3f4f6; }
        .amount { font-weight: bold; color: #111827; font-family: monospace; font-size: 20px;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">Payment Receipt</div>
    <div class="content">
        <p>Hi <strong>{{STUDENT_NAME}}</strong>,</p>
        <p>You just completed a tap-and-pay transaction at <strong>{{MERCHANT_NAME}}</strong>.</p>

        <div class="receipt-box">
            <div><strong>Amount Paid:</strong></div>
            <div class="amount">₹{{AMOUNT}}</div>
        </div>

        <p>The funds have been securely deducted from your wallet balance.</p>

        <a href="{{DASHBOARD_URL}}" class="button">View Wallet Balance</a>
    </div>
    <div class="footer">
        &copy; 2026 PaymentX Technologies. All rights reserved.
    </div>
</div>
</body>
</html>
